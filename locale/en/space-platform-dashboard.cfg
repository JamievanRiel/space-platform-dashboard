[mod-name]
space-platform-dashboard=Space Platform Dashboard

[mod-description]
space-platform-dashboard=All your space platforms in one table: where they are, where they are going and when they arrive, hub health, cargo, missing construction materials and completed trips. Alerts when a platform is damaged, stalls without thrust, has no path or flies with empty turrets. Jump to a platform, pin it or pause it from the table.

[shortcut-name]
space-platform-dashboard=Space platform dashboard

[controls]
space-platform-dashboard-toggle=Toggle space platform dashboard

[mod-setting-name]
space-platform-dashboard-alert-damage=Alert when a platform is damaged
space-platform-dashboard-alert-ammo=Alert when turrets have no ammo in flight
space-platform-dashboard-alert-stalled=Alert when a platform stalls
space-platform-dashboard-alert-no-path=Alert when a platform has no path
space-platform-dashboard-stall-seconds=Stalled after (seconds)

[mod-setting-description]
space-platform-dashboard-alert-damage=The hub has lost health or foundation tiles are damaged.
space-platform-dashboard-alert-ammo=Only while travelling between planets, where asteroids attack.
space-platform-dashboard-alert-stalled=The platform wants to leave or travel but has not enough thrust (no thrusters or no fuel), or it stopped on its way.
space-platform-dashboard-alert-no-path=The schedule points to a destination the platform cannot reach.
space-platform-dashboard-stall-seconds=How long a platform has to lack thrust before it counts as stalled.

